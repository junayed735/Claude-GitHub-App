<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junayed, media buyer and growth specialist</title>
  <meta name="description" content="Paid ads on Meta, TikTok and Google. $3M in ad spend managed, $9M in revenue generated for 50+ brands.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1F3A'/%3E%3Crect x='8' y='17' width='4' height='7' rx='1' fill='%23fff'/%3E%3Crect x='14' y='13' width='4' height='11' rx='1' fill='%23fff'/%3E%3Crect x='20' y='8' width='4' height='16' rx='1' fill='%2330C483'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header wrap">
    <a class="wordmark" href="#top" data-bind="name">Junayed</a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="#clients">Clients</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="intro wrap" id="top">
      <div class="person">
        <div class="photo" id="photo"><span aria-hidden="true">J</span></div>
        <div>
          <h1 class="name" data-bind="name">Junayed</h1>
          <p class="role" data-bind="role"></p>
        </div>
      </div>

      <p class="ledger" aria-label="">
        <span class="spent"><span data-bind="spend"></span> spent.</span>
        <span class="back"><span data-bind="revenue"></span> back.</span>
      </p>

      <div class="facts">
        <p data-bind="intro" class="intro-line"></p>
        <dl class="fact-list">
          <div><dt>Brands</dt><dd data-bind="brands"></dd></div>
          <div><dt>Years</dt><dd data-bind="years"></dd></div>
          <div><dt>Return on spend</dt><dd id="roas"></dd></div>
          <div><dt>Platforms</dt><dd id="platforms"></dd></div>
        </dl>
      </div>
    </section>

    <section class="mission wrap" aria-labelledby="mission-h">
      <h2 id="mission-h">Mission</h2>
      <p data-bind="mission"></p>
    </section>

    <section class="work wrap" id="work" aria-labelledby="work-h">
      <h2 id="work-h">Case studies</h2>
      <div id="cases"></div>
    </section>

    <section class="clients wrap" id="clients" aria-labelledby="clients-h">
      <h2 id="clients-h">Brands I’ve worked with</h2>
      <ul class="logo-wall" id="logos"></ul>
    </section>

    <section class="contact" id="contact" aria-labelledby="contact-h">
      <div class="wrap">
        <h2 id="contact-h">Want ads that pay for themselves?</h2>
        <a class="email" id="email" href="#"></a>
        <ul class="links" id="links"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">© <span id="year"></span> <span data-bind="name"></span></div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
